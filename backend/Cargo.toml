[workspace]
resolver = "2"
members = ["engine", "server"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
